# ankra-cloud-ccm on Ankra Pipelines.
#
# Every push and pull request: go vet, the unit tests, golangci-lint, govulncheck and the chart gates. A pull request
# also builds the multi-arch image and throws it away. A push to main publishes the image as sha-<7> and is also
# the release: when the chart's appVersion is not published yet, the same run publishes the image as v<semver> and
# pushes the chart to oci://share.ankra.cloud/charts. Nobody pushes a tag; a release the registry failed is repeated
# with 'ankra pipeline run --ref main', which publishes only what is still missing. Images are built without a
# daemon: ko cross-compiles the controller onto distroless for linux/amd64 and linux/arm64 and attaches an SPDX SBOM
# (hack/image.sh).
#
# share_login is the Docker config for share.ankra.cloud, from the organisation's connected registry
# share-ankra-cloud. It is a protected section: the image and chart stages publish only once an administrator has
# approved this definition.
apiVersion: ankra.io/v1
kind: Pipeline
metadata:
  name: "ankra-cloud-ccm"
on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
    fork_policy: "read_only"
  manual: {}
concurrency:
  group: "ankra-cloud-ccm-${{ ankra.ref }}"
  cancel_in_progress: true
workspace:
  size: "20Gi"
  access: "rwo"
defaults:
  image: "golang:1.26@sha256:6c2a5538f964f1c82f97ad14988bf05de100d922d159d0e398b54c7b0ca0c6c9"
  timeout: "30m"
  network: "egress-https"
  # Steps run unprivileged with a read-only root file system, so every cache and scratch directory is in the
  # shared workspace. TMPDIR and XDG_CACHE_HOME are names Ankra reserves, so a run that declared one here is refused
  # before checkout; a stage that needs one exports it in its script.
  env:
    # The workspace root belongs to another user, so git refuses VCS stamping and go build fails; no binary reads it.
    GOFLAGS: "-buildvcs=false"
    GOTOOLCHAIN: "local"
    GOMAXPROCS: "2"
    GOPATH: "/workspace/.ci-cache/go"
    GOCACHE: "/workspace/.ci-cache/go-build"
    GOTMPDIR: "/workspace/.ci-tmp"
    GOLANGCI_LINT_CACHE: "/workspace/.ci-cache/golangci-lint"
    XDG_CONFIG_HOME: "/workspace/.ci-tmp/config"
    HELM_CACHE_HOME: "/workspace/.ci-tmp/helm-cache"
    HELM_CONFIG_HOME: "/workspace/.ci-tmp/helm-config"
    HELM_DATA_HOME: "/workspace/.ci-tmp/helm-data"
permissions:
  contents: "read"
secrets:
  - name: "share_login"
    from: "registry"
    key: "share-ankra-cloud"
stages:
  - name: "checkout"
    kind: "checkout"

  - name: "test"
    kind: "run"
    needs:
      - "checkout"
    run: |-
      set -eu
      mkdir -p "${GOTMPDIR}"
      test -z "$(gofmt -l cmd internal tools)"
      make vet
      make test
    cache:
      - key: "go-${{ hashFiles('go.sum') }}"
        paths:
          - "/workspace/.ci-cache/go"
          - "/workspace/.ci-cache/go-build"
    resources:
      cpu: "2"
      memory: "4Gi"

  - name: "lint"
    kind: "run"
    image: "golangci/golangci-lint:v2.13.2@sha256:ba07dffad130794ae79ebaa0056809d18c0168f3f846480ffd3eb6c04578b83d"
    needs:
      - "checkout"
    run: |-
      mkdir -p "${GOTMPDIR}"
      make lint
    cache:
      - key: "go-lint-${{ hashFiles('go.sum') }}"
        paths:
          - "/workspace/.ci-cache/go"
          - "/workspace/.ci-cache/go-build"
          - "/workspace/.ci-cache/golangci-lint"

  # Reported, not blocking: a finding with no released fix upstream would otherwise stop every release.
    resources:
      cpu: "2"
      memory: "4Gi"

  - name: "vulnerabilities"
    kind: "run"
    needs:
      - "checkout"
    allow_failure: true
    run: |-
      mkdir -p "${GOTMPDIR}"
      go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
    cache:
      - key: "go-${{ hashFiles('go.sum') }}"
        paths:
          - "/workspace/.ci-cache/go"
          - "/workspace/.ci-cache/go-build"
    resources:
      cpu: "2"
      memory: "4Gi"

  - name: "helm"
    kind: "run"
    needs:
      - "checkout"
    run: |-
      set -eu
      mkdir -p "${GOTMPDIR}" "${HELM_CONFIG_HOME}"
      PATH="$(./hack/ci-helm.sh):${PATH}"
      export PATH
      make helm-lint

  - name: "image-check"
    kind: "run"
    needs:
      - "test"
      - "lint"
      - "helm"
    when:
      events:
        - "pull_request"
    run: |-
      set -eu
      mkdir -p "${GOTMPDIR}"
      TMPDIR="${GOTMPDIR}"
      export TMPDIR
      go install github.com/google/ko@v0.19.1
      PATH="${GOPATH}/bin:${PATH}"
      export PATH
      IMAGE=share.ankra.cloud/library/ankra-cloud-ccm TAGS="sha-$(printf '%s' "${ANKRA_HEAD_SHA}" | cut -c1-7)" PUSH=false ./hack/image.sh
    cache:
      - key: "go-image-${{ hashFiles('go.sum') }}"
        paths:
          - "/workspace/.ci-cache/go"
          - "/workspace/.ci-cache/go-build"
    resources:
      cpu: "2"
      memory: "4Gi"

  - name: "image"
    kind: "run"
    needs:
      - "test"
      - "lint"
      - "helm"
    when:
      events:
        - "push"
        - "manual"
    secrets:
      - "share_login"
    run: |-
      set -eu
      mkdir -p "${GOTMPDIR}"
      TMPDIR="${GOTMPDIR}"
      export TMPDIR
      go install github.com/google/ko@v0.19.1
      go install github.com/google/go-containerregistry/cmd/crane@v0.22.1
      PATH="${GOPATH}/bin:${PATH}"
      export PATH
      DOCKER_CONFIG="$(mktemp -d)"
      export DOCKER_CONFIG
      cp /run/agent-secrets/share_login "${DOCKER_CONFIG}/config.json"
      version="$(sed -n 's/^appVersion: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' charts/ankra-cloud-ccm/Chart.yaml)"
      case "${version}" in
        v[0-9]*) ;;
        *) echo "image: charts/ankra-cloud-ccm/Chart.yaml has appVersion '${version}', not v<semver>" >&2; exit 1 ;;
      esac
      commit_tag="sha-$(printf '%s' "${ANKRA_HEAD_SHA}" | cut -c1-7)"
      # The version comes first so the released binary reports it; a commit that is not a release reports its commit.
      tags="$(./hack/unpublished-tags.sh share.ankra.cloud/library/ankra-cloud-ccm "${version}" "${commit_tag}")"
      if [ -z "${tags}" ]; then
        echo "image: ${version} and ${commit_tag} are already published"
        exit 0
      fi
      IMAGE=share.ankra.cloud/library/ankra-cloud-ccm TAGS="${tags}" PUSH=true ./hack/image.sh
    cache:
      - key: "go-image-${{ hashFiles('go.sum') }}"
        paths:
          - "/workspace/.ci-cache/go"
          - "/workspace/.ci-cache/go-build"
    resources:
      cpu: "2"
      memory: "4Gi"

  # A release also publishes the chart as an OCI artifact: once per chart version, after the image stage has made
  # sure the image its appVersion names is published. The helm repository (https://ankraio.github.io/ankra-charts)
  # is updated by a pull request to github.com/ankraio/ankra-charts.
  - name: "chart"
    kind: "run"
    needs:
      - "image"
    when:
      events:
        - "push"
        - "manual"
    secrets:
      - "share_login"
    run: |-
      set -eu
      mkdir -p "${GOTMPDIR}" "${HELM_CONFIG_HOME}"
      PATH="$(./hack/ci-helm.sh):${PATH}"
      export PATH
      chart_version="$(sed -n 's/^version: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' charts/ankra-cloud-ccm/Chart.yaml)"
      # Anything but "not found" is an error: pushing after a failed lookup would replace a published chart.
      if answer="$(helm show chart oci://share.ankra.cloud/charts/ankra-cloud-ccm --version "${chart_version}" \
        --registry-config /run/agent-secrets/share_login 2>&1 >/dev/null)"; then
        echo "chart: ankra-cloud-ccm ${chart_version} is already published"
        exit 0
      fi
      case "${answer}" in
        *"not found"*) ;;
        *) echo "chart: could not look up ankra-cloud-ccm ${chart_version}: ${answer}" >&2; exit 1 ;;
      esac
      package_directory="$(mktemp -d "${GOTMPDIR}/chart.XXXXXX")"
      helm package charts/ankra-cloud-ccm --destination "${package_directory}"
      helm push "${package_directory}"/ankra-cloud-ccm-*.tgz oci://share.ankra.cloud/charts \
        --registry-config /run/agent-secrets/share_login
